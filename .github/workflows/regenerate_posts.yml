name: Regenerate Policy Posts

on:
  workflow_dispatch:
    inputs:
      days:
        description: '재생성 대상 기간(일)'
        required: false
        default: '90'
      limit:
        description: '최대 처리 건수 (0=무제한)'
        required: false
        default: '0'
      min_chars:
        description: '이 분량(자) 이상인 글은 건너뜀 (0=전부 재생성)'
        required: false
        default: '0'

jobs:
  regenerate-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Run regeneration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
          REB_RONE_API_KEY: ${{ secrets.REB_RONE_API_KEY }}
          ANALYZER_MAX_RETRIES: '3'
        run: |
          python agent/regenerate.py \
            --days "${{ github.event.inputs.days }}" \
            --limit "${{ github.event.inputs.limit }}" \
            --min-chars "${{ github.event.inputs.min_chars }}" \
            --delay 8

      - name: Commit and push changes
        env:
          TZ: Asia/Seoul
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/posts.json
          git commit -m "chore: regenerate policy posts with upgraded pipeline [$(date +'%Y-%m-%d %H:%M:%S KST')]" || echo "No changes to commit"
          git push
